name: post-quantum-scale-measurements

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  combined-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        point:
          - "1696:848:230"
          - "1698:849:231"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned classical estimator
        run: python -m pip install -e ".[estimator]"
      - name: Measure combined classical/quantum/correctness screen
        run: python experiments/post_quantum_scale_probe.py --point "${{ matrix.point }}" --classical-floor-bits 128 --quantum-floor-bits 128 --max-repetitions 512
