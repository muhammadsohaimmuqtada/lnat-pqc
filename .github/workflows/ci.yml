name: research-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install operational profile
        run: python -m pip install -e ".[pqc]"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Installed CLI self-test
        run: lnat-pqc selftest
      - name: Real CLI file round-trip
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          lnat-pqc keygen --public-out "$work/public.lnat" --private-out "$work/private.lnat"
          lnat-pqc encap --public "$work/public.lnat" --ciphertext-out "$work/ciphertext.lnat" --key-out "$work/sender.key"
          lnat-pqc decap --public "$work/public.lnat" --private "$work/private.lnat" --ciphertext "$work/ciphertext.lnat" --key-out "$work/receiver.key"
          cmp "$work/sender.key" "$work/receiver.key"
          test "$(stat -c '%a' "$work/private.lnat")" = "600"
          test "$(stat -c '%a' "$work/sender.key")" = "600"
          test "$(stat -c '%a' "$work/receiver.key")" = "600"
      - name: Reproduce archived KEM-v1 break
        run: python attacks/public_recovery_v1.py
      - name: Recover 8-bit toy seed
        run: python attacks/exhaustive_seed_recovery.py --seed-bits 8 --traces 3 --noise 0.05
      - name: Statistical smoke probe
        run: python attacks/statistical_probe.py --samples 8
      - name: Automaton avalanche ablation
        run: python experiments/avalanche_probe.py --samples 8
      - name: Alekhnovich-style public-key comparator
        run: python experiments/code_pke_probe.py --trials 16
      - name: LNAT-derived code witness bridge
        run: python experiments/lnat_code_bridge_probe.py --trials 16
      - name: Public break of toy LNAT code bridge
        run: python attacks/bridge_sparse_witness_recovery.py
      - name: Code profile correctness and search audit
        run: python experiments/code_profile_audit.py --trivial-floor-bits 16
      - name: Full-KEM parameter frontier regression
        run: python experiments/code_parameter_frontier.py --n 256 --k 128 --prange-trial-bits 32 --error-weight 1 --encapsulated-bits 128 --kem-failure-ceiling 1e-9 --max-repetitions 300
      - name: Code KEM channel efficiency audit
        run: python experiments/code_channel_audit.py --n 256 --k 128 --secret-weight 30 --error-weight 1 --repetitions 233 --cutoff 66 --message-bits 128 --tag-bytes 16
      - name: Full LNAT code KEM research round-trip
        run: python experiments/lnat_code_kem_probe.py --trials 4
      - name: Public break of toy LNAT code KEM
        run: python attacks/code_kem_public_decapsulation.py
      - name: Operational hybrid smoke test
        run: python src/lnat_hybrid_kem.py
      - name: Compile
        run: python -m compileall -q src tests attacks benchmarks experiments
