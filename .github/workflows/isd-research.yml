name: isd-research-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  isd-baselines:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: ISD unit tests
        run: python -m unittest tests.test_code_isd tests.test_code_stern tests.test_code_dumer -v
      - name: Executable Lee-Brickell probe
        run: python experiments/lee_brickell_probe.py
      - name: Executable Stern collision probe
        run: python experiments/stern_probe.py
      - name: Executable Dumer enlarged-set probe
        run: python experiments/dumer_probe.py
      - name: Compile ISD modules
        run: python -m compileall -q src/code_isd.py src/code_stern.py src/code_dumer.py tests/test_code_isd.py tests/test_code_stern.py tests/test_code_dumer.py experiments/lee_brickell_probe.py experiments/stern_probe.py experiments/dumer_probe.py
