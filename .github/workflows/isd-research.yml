name: isd-research-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  isd-baselines:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: ISD unit tests
        run: python -m unittest tests.test_code_isd tests.test_code_stern tests.test_code_sd_estimator tests.test_code_modern_frontier tests.test_code_modern_frontier_real -v
      - name: Executable Lee-Brickell probe
        run: python experiments/lee_brickell_probe.py
      - name: Executable Stern collision probe
        run: python experiments/stern_probe.py
      - name: Compile ISD modules
        run: python -m compileall -q src/code_isd.py src/code_stern.py src/code_sd_estimator.py src/code_modern_frontier.py tests/test_code_isd.py tests/test_code_stern.py tests/test_code_sd_estimator.py tests/test_code_modern_frontier.py tests/test_code_modern_frontier_real.py experiments/lee_brickell_probe.py experiments/stern_probe.py experiments/upstream_isd_probe.py experiments/modern_isd_scale_probe.py experiments/modern_frontier_probe.py

  upstream-modern-estimator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned estimator bridge
        run: python -m pip install -e ".[estimator]"
      - name: Enforce modern frontier unit and real-estimator regressions
        run: python -m unittest tests.test_code_sd_estimator tests.test_code_modern_frontier tests.test_code_modern_frontier_real -v
      - name: Cross-check rejected legacy profile
        run: python experiments/upstream_isd_probe.py --n 256 --k 128 --weight 48 --top 8
      - name: Exercise reusable effective frontier CLI
        run: python experiments/modern_frontier_probe.py --n 1072 --k 536 --weight 117 --attack-floor-bits 128 --max-repetitions 512
