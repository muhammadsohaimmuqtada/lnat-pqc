[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lnat-pqc-research"
version = "0.3.4a0"
description = "LNAT experimental primitive, cryptanalysis harness, and ML-KEM hybrid research profile"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pqc = ["cryptography>=47.0.0,<50"]
dev = ["cryptography>=47.0.0,<50"]

[project.scripts]
lnat-pqc = "lnat_cli:main"

[tool.setuptools]
py-modules = [
  "lnat_core",
  "lnat_params",
  "lnat_kem",
  "lnat_hybrid_kem",
  "lnat_analysis",
  "lnat_cli",
  "code_pke_reference",
  "lnat_code_bridge",
  "code_attacks",
]
package-dir = { "" = "src" }
