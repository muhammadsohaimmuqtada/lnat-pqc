[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lnat-pqc-research"
version = "0.2.0a0"
description = "Experimental research implementation of Learning Noisy Automata Transitions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
py-modules = ["lnat_core", "lnat_params", "lnat_kem"]
package-dir = { "" = "src" }
